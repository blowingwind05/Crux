# Crux AgenticRAG 配置 — arxiv 全量数据集
#
# 使用 parquet 格式的 arxiv 元数据快照
# Embedding/Reranker 指向本地模型服务（通过 backend 启动）
#
# 使用方法:
#   python -m backend.main  # 启动后端（含模型推理服务）
#   然后在 CruxConfig 中引用此文件:
#     config = CruxConfig.from_yaml("config_arxiv_full.yaml")

# ============================================================
# LLM 配置
# ============================================================
llm:
  api_key: ${OPENAI_API_KEY:EMPTY}
  base_url: ${OPENAI_BASE_URL:http://10.208.62.156:8002/v1}
  model: "Qwen3-32B"
  temperature: 0.7
  max_tokens: 4096

# ============================================================
# 检索配置
# ============================================================
search:
  max_iterations: 3
  top_k: 10
  use_bm25: true
  use_vector: true
  use_metadata_filter: true

# ============================================================
# 混合检索器配置
# Embedding / Rerank 指向本地模型服务
# ============================================================
retriever:
  # 索引存储路径
  papers_embeddings_save_path: "/workspace/arxiv_embeddings/"
  papers_index_save_path: "/workspace/arxiv_bm25_index/"

  # Embedding API — 指向本地 backend 服务
  use_api_emb: true
  api_key_emb: "EMPTY"
  base_url_emb: "http://localhost:8001/v1/"
  model_emb: "bge-m3"

  # Rerank API — 指向本地 backend 服务
  use_api_rerank: true
  api_key_rerank: "EMPTY"
  base_url_rerank: "http://localhost:8001/v1/"
  model_rerank: "bge-reranker-v2-m3"

  # 检索参数
  top_k_retrieval: 60
  top_k_final: 10
  batch_size: 32
  device: "cuda"
  max_retries: 3
  fusion_k: 60
  rerank: true

# ============================================================
# 研判配置
# ============================================================
judge:
  use_parallel: true
  max_retry: 5
  max_workers: 4
  batch_size: 4

# ============================================================
# 数据源配置 — arxiv 全量 parquet
# ============================================================
data_source:
  type: "hybrid"
  path: "/workspace/arxiv-metadata-oai-snapshot.parquet"

# ============================================================
# Schema 配置
# ============================================================
schema:
  name: paper
  description: "学术论文数据结构（arxiv 全量数据集）"

  fields:
    - name: arxiv_id
      type: string
      description: "论文的 arXiv ID（如 '0704.0001'）"
      searchable: false

    - name: title
      type: string
      description: "论文标题"
      searchable: true

    - name: abstract
      type: string
      description: "论文摘要"
      searchable: true

    - name: arxiv_url
      type: string
      description: "论文 arXiv 链接"
      searchable: false

    - name: authors
      type: array
      description: "作者列表"
      searchable: false

    - name: date
      type: date
      description: "最后更新日期（如 '2008-11-26'）"
      searchable: false
      filterable: true
      operators:
        - eq
        - gt
        - lt
        - gte
        - lte
        - range

    - name: categories
      type: string
      description: "arXiv 分类（如 'hep-ph', 'cs.AI'）"
      searchable: false
      filterable: true

  example_queries:
    - "找一下关于 RAG 和检索增强生成的最新论文"
    - "帮我找 cs.AI 分类下关于强化学习的论文"
    - "搜索关于大语言模型推理能力的论文"
    - "有什么关于 Agent 智能体的研究吗？"

# ============================================================
# 调试选项
# ============================================================
debug: false
mock_llm: false

# ============================================================
# 模型服务配置
# ============================================================
model_service:
  embedding_model: "/workspace/bge-m3"
  reranker_model: "/workspace/bge-reranker-v2-m3"
  device: "cuda"
  batch_size: 64
