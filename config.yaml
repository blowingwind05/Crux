# Crux AgenticRAG 配置文件示例
# 复制此文件为 .config.yaml 并根据需要修改
# 
# 支持环境变量引用：${ENV_VAR} 或 ${ENV_VAR:default_value}

# ============================================================
# LLM 配置
# ============================================================
llm:
  # API 密钥（推荐使用环境变量）
  api_key: ${OPENAI_API_KEY:EMPTY}
  # API 基础地址
  base_url: ${OPENAI_BASE_URL:https://aicloud.oneainexus.cn:30013/inference/aicloud-yanqiang/qwen3-32b-server/v1}
  # 模型名称
  model: "Qwen/Qwen3-32B"
  # 生成温度
  temperature: 0.7
  # 最大 token 数
  max_tokens: 4096

# ============================================================
# 检索配置
# ============================================================
search:
  # 最大迭代次数
  max_iterations: 3
  # 每次检索返回的文档数
  top_k: 10
  # 是否使用 BM25 稀疏检索
  use_bm25: true
  # 是否使用向量检索
  use_vector: true
  # 是否使用元数据过滤
  use_metadata_filter: true

# ============================================================
# 混合检索器配置（Embedding / Rerank / BM25）
# ============================================================
retriever:
  # 索引存储路径
  papers_embeddings_save_path: "./data/embeddings/"
  papers_index_save_path: "./data/bm25_index/"

  # Embedding API
  use_api_emb: true
  api_key_emb: ${RETRIEVER_EMB_API_KEY:sk-ar5BCVAl0YZWGZEqvA18Z6uKUHHhacFYpWsWJoEFPqLDbOPa}
  base_url_emb: "https://www.dmxapi.com/v1/"
  model_emb: "qwen3-embedding-8b"

  # Rerank API
  use_api_rerank: true
  api_key_rerank: ${RETRIEVER_RERANK_API_KEY:sk-4hASE0X4XFKhQHOUGmdKEBN54p0N7nAWEkMzDMiGXVXfndEH}
  base_url_rerank: "https://www.dmxapi.cn/v1/"
  model_rerank: "bge-reranker-v2-m3-free"

  # 检索参数
  top_k_retrieval: 60
  top_k_final: 10
  batch_size: 8
  device: "cuda"
  max_retries: 3
  fusion_k: 60
  rerank: true

# ============================================================
# 研判配置
# ============================================================
judge:
  # 是否并行研判
  use_parallel: true
  # 最大重试次数
  max_retry: 5
  # 并行工作线程数
  max_workers: 4
  # 批处理大小
  batch_size: 4

# ============================================================
# 数据源配置
# ============================================================
data_source:
  # 数据源类型: json, csv, milvus, qdrant, es
  type: "hybrid"
  # 数据文件路径（相对于项目根目录或绝对路径）
  path: "data/ir_papers.json"

# ============================================================
# Schema 配置（定义数据结构）
# ============================================================
schema:
  name: paper
  description: "学术论文数据结构，包含标题、摘要、作者等基本信息"
  
  # 字段定义
  fields:
    - name: arxiv_id
      type: string
      description: "论文的 arXiv ID（如 '2512.23647'）"
      searchable: false
      
    - name: title
      type: string
      description: "论文标题"
      searchable: true
      
    - name: abstract
      type: string
      description: "论文摘要"
      searchable: true
      
    - name: arxiv_url
      type: string
      description: "论文 arXiv 链接"
      searchable: false
      
    - name: authors
      type: array
      description: "作者列表"
      searchable: false
      
    - name: date
      type: date
      description: "发布日期（如 '2025-12-29'）"
      searchable: false
      filterable: true
      operators:
        - eq
        - gt
        - lt
        - gte
        - lte
        - range

  # 示例查询（用于提示 LLM）
  example_queries:
    - "找一下关于 RAG 和检索增强生成的最新论文"
    - "帮我找2024年发布的信息检索方向高分论文"
    - "有什么关于 Agent 智能体的研究吗？"
    - "搜索关于大语言模型推理能力的论文"

# ============================================================
# 调试选项
# ============================================================
# 是否启用调试模式
debug: false
# 是否使用 Mock LLM 响应（用于测试）
mock_llm: false
